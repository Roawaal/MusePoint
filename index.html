<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusePoint - The Last Supper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="museum-container">

    <div id="painting-wrapper">
        <img
            id="painting"
            src="lastsupper.jpg"
            alt="The Last Supper"
        >

        <div id="markers"></div>
    </div>

    <div id="info-panel">
        <h2 id="person-name">Point to a figure</h2>
        <p id="person-info">
            Keep the pointer over a figure for one second.
        </p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
